name: Update East Potomac Park Tracker

on:
  schedule:
    - cron: '0 12 * * *'  # daily at 12:00 UTC (8am ET)
  workflow_dispatch:       # lets you also trigger it manually from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests pandas matplotlib scikit-learn beautifulsoup4

      - name: Run update script
        env:
          COURTLISTENER_TOKEN: ${{ secrets.COURTLISTENER_TOKEN }}
          BUTTONDOWN_API_KEY: ${{ secrets.BUTTONDOWN_API_KEY }}
        run: python scripts/update_data.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --quiet || ! git diff --staged --quiet; then
            git commit -m "Automated daily update"
            git fetch origin main
            git merge origin/main -X ours --no-edit || true
            git push
          fi
